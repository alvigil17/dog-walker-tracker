<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dog Walking Tracker</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <div class="container mt-4">

        <h1>Dog Walking Tracker</h1>

        <p>Use this page to keep track of dog walks.</p>

        <div class="card p-3 mb-4">

            <h2>Add a Walk</h2>

            <form id="walkForm">

                <div class="mb-3">
                    <label for="dogName" class="form-label">Dog Name</label>
                    <input type="text" id="dogName" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="walkDate" class="form-label">Date</label>
                    <input type="date" id="walkDate" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="walkTime" class="form-label">Walk Time in Minutes</label>
                    <input type="number" id="walkTime" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="walkNotes" class="form-label">Notes</label>
                    <textarea id="walkNotes" class="form-control"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    Add Walk
                </button>

            </form>

        </div>

        <div class="card p-3">

            <h2>Walk History</h2>

            <div id="walkList">
                <p>No walks added yet.</p>
            </div>

            <button id="clearWalks" class="btn btn-secondary mt-2">
                Clear Walks
            </button>

        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
